name: Update VTVcab streams

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Update four VTVcab channels
        env:
          FILM4K_BASE_URL: https://film4k.net
          FILM4K_TV_PATH: /api/tv/
          FILM4K_LOGIN_PATH: /api/auth/signin
          FILM4K_USERNAME: ${{ secrets.FILM4K_USERNAME }}
          FILM4K_PASSWORD: ${{ secrets.FILM4K_PASSWORD }}
        run: python scripts/update_vtvcab.py xemtv.m3u

      - name: Commit if changed
        run: |
          if git diff --quiet -- xemtv.m3u; then
            echo "No stream changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xemtv.m3u
          git commit -m "chore: update VTVcab streams"
          git push
