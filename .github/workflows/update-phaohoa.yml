name: Refresh Pháo Hoa playlist

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-phaohoa-playlist
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh Pháo Hoa block
        run: python scripts/update_phaohoa.py

      - name: Commit and push when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xemtv.m3u
          if git diff --staged --quiet; then
            echo "No playlist changes"
            exit 0
          fi
          git commit -m "Auto-update Pháo Hoa playlist"
          git push
